<style>
:root {
  --bg: #0b0709; --surface: #150d11; --surface-2: #1e1117; --line: #3a1b24;
  --fg: #f4ebe6; --muted: #ab9297; --red: #e5262d; --red-glow: rgba(229, 38, 45, .22);

* { box-sizing: border-box; }
html { background: #0b0709; }
[hidden] { display: none !important; }

.prog { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; direction: ltr; }
.prog i { display: block; height: 100%; background: linear-gradient(90deg, #8b1a22, #ff4a4f); transition: width .5s; }

.board-wrap { height: min(34vh, 260px); overflow-y: auto; overscroll-behavior: contain; border: 1px solid var(--line); border-radius: 12px; padding: 6px; background: var(--surface); }

.cell .n { position: absolute; top: 1px; inset-inline-start: 3px; font-size: .55rem; color: var(--muted); }
.cell.seen { background: rgba(229, 38, 45, .16); }
.cell.fin { border-color: var(--red); } .cell.fin .n, .cell.sta .n { color: var(--bad); font-weight: 800; }

  content: ''; position: absolute; inset: 22%; border-radius: 50%; background: #ff4a4f; box-shadow: 0 0 12px #ff4a4f, 0 0 0 2px var(--fg);

.dice { display: flex; gap: 10px; justify-content: center; }
.die {

.die i { border-radius: 50%; place-self: center; width: 9px; height: 9px; }
.die i.on { background: var(--pip); }
.total { text-align: center; font-size: 1.05rem; } .total b { font-size: 1.5rem; }

.abil b { font-size: 1rem; } .abil:active { border-color: var(--red); } .abil:disabled { opacity: .4; cursor: default; }
.abil.card { cursor: default; margin-bottom: 8px; } .abil.dead { opacity: .55; }
.abil.sel { border-color: var(--red); background: var(--red-glow); }

.sheet {

.chk select { min-height: 26px; width: auto; padding: 0 4px; font-size: .8rem; }
.chk input { width: 18px; height: 18px; }
details > summary { cursor: pointer; font-weight: 800; }
.win { position: fixed; inset: 0; z-index: 20; background: rgba(6, 3, 4, .94); display: grid; place-items: center; text-align: center; padding: 24px; }
.win h2 { font-family: var(--display); font-weight: 400; font-size: 2.4rem; color: #ff4a4f; text-shadow: 0 0 24px rgba(229, 38, 45, .7); }

.clock { font-family: var(--display); font-size: 1.7rem; letter-spacing: .08em; color: #ff4a4f; direction: ltr; text-shadow: 0 0 12px rgba(229, 38, 45, .6); font-variant-numeric: tabular-nums; }
.clock.low { color: #fff; animation: pulse 1s infinite; } .clock.paused { opacity: .5; }
@keyframes pulse { 50% { opacity: .35; } }
.cell .t { position: absolute; left: 0; right: 0; bottom: 1px; text-align: center; font-size: .78rem; line-height: 1; }
.cell.empty { visibility: hidden; }
.toast { position: fixed; left: 16px; right: 16px; top: 16%; max-width: 440px; margin-inline: auto; z-index: 40; text-align: center; padding: 18px 16px; border-radius: 16px; background: rgba(21, 13, 17, .97); border: 2px solid var(--red); box-shadow: 0 0 40px var(--red-glow), 0 12px 40px rgba(0, 0, 0, .6); animation: pop .35s ease-out; pointer-events: none; }
.toast.good { border-color: var(--good); }
.toast .ti { font-size: 3rem; line-height: 1.2; } .toast h2 { font-size: 1.4rem; color: #ff6a6f; } .toast.good h2 { color: var(--good); } .toast p { margin: 4px 0; }
@keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
.trapcard { margin-top: 8px; padding: 10px; border-radius: 10px; border: 1px solid var(--red); background: var(--red-glow); text-align: center; }
.cell.trap { border-color: #7a2b34; } .cell.bonus { border-color: #2b7a58; }
.fa { display: block; direction: rtl; text-align: right; font-family: var(--body); }
.abil .fa { color: var(--muted); font-size: .88rem; }
.rolecard { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: linear-gradient(160deg, rgba(61, 220, 151, .12), var(--surface)); }
.rolecard.t { border-color: var(--red); background: linear-gradient(160deg, rgba(229, 38, 45, .32), var(--surface)); }
.rolecard h2 { font-size: 1.25rem; } .rolecard p { margin: 6px 0; line-height: 1.7; }

<script>
'use strict';
/* ====================== ابزارهای کوچک ====================== */
const SD = window.SD;
const Q = new URLSearchParams(location.search);
const AS = Q.get('as') || '';                                   // فقط برای تست چند صفحه در یک مرورگر
const RELAY = (Q.get('relay') || 'https://ntfy.sh').replace(/\/+$/, '');
const LIM = { 1: 20, 2: 15, 3: 10 };
const LVN = { 1: 'Easy', 2: 'Medium', 3: 'Hard' };
const $ = id => document.getElementById(id);
const fa = n => String(n);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rid = () => Math.random().toString(36).slice(2, 10);
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k) { try { return localStorage.getItem(k + AS); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k + AS, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k + AS); } catch (e) {} }
};
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };

/* ====================== QR (نسخه ۱ تا ۵، سطح L) ====================== */
function qrMatrix(text) {

  const deg = ECC[ver]; const div = new Array(deg).fill(0); div[deg - 1] = 1; let root = 1;
  for (let i = 0; i < deg; i++) { for (let j = 0; j < deg; j++) { div[j] = mul(div[j], root); if (j + 1 < deg) div[j] ^= div[j + 1]; } root = mul(root, 2); }
  const rem = new Array(deg).fill(0);
  for (const b of data) { const f = b ^ rem.shift(); rem.push(0); div.forEach((c, i) => { rem[i] ^= mul(c, f); }); }
  const all = data.concat(rem);
  const grid = () => Array.from({ length: size }, () => new Array(size).fill(false));
  const mod = grid(), fn = grid();
  const setF = (M, x, y, d) => { M[y][x] = d; fn[y][x] = true; };
  for (let i = 0; i < size; i++) { setF(mod, 6, i, i % 2 === 0); setF(mod, i, 6, i % 2 === 0); }
  const finder = (cx, cy) => { for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) { const d = Math.max(Math.abs(dx), Math.abs(dy)), x = cx + dx, y = cy + dy; if (x >= 0 && x < size && y >= 0 && y < size) setF(mod, x, y, d !== 2 && d !== 4); } };
  finder(3, 3); finder(size - 4, 3); finder(3, size - 4);

  for (let right = size - 1; right >= 1; right -= 2) {

    (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => (x * y) % 2 + (x * y) % 3 === 0,
    (x, y) => ((x * y) % 2 + (x * y) % 3) % 2 === 0, (x, y) => (((x + y) % 2) + (x * y) % 3) % 2 === 0];

    let p = 0, dark = 0;
    for (let a = 0; a < size; a++) for (const rowwise of [true, false]) {
      let run = 1;
      for (let b = 1; b < size; b++) {

      if (M[y][x]) dark++;

    const M = mod.map(r => r.slice());

}

/* ====================== ارتباط زنده (چند رله‌ی هم‌زمان) ====================== */
const RELAYS = [
  { n: 'ntfy', k: 'ntfy', u: RELAY },
  { n: 'HiveMQ', k: 'mqtt', u: 'wss://broker.hivemq.com:8884/mqtt' },
  { n: 'EMQX', k: 'mqtt', u: 'wss://broker.emqx.io:8084/mqtt' },
  { n: 'Mosquitto', k: 'mqtt', u: 'wss://test.mosquitto.org:8081' }
];
const relayLine = st => RELAYS.filter(r => r.n in st).map(r => r.n + ' ' + ({ ok: '✓', fail: '✗', wait: '…' }[st[r.n]] || '…')).join(' · ');
const okCount = st => Object.values(st || {}).filter(x => x === 'ok').length;
const statText = (s, d) => (s === 'on' ? 'متصل' : s === 'err' ? 'ارسال پیام ناموفق بود' : 'در حال اتصال') + ' · ' + relayLine(d || {});

function ntfyConn(def, topic, onData, onSt) {
  let ws = null, closed = false, lastId = '', retry = 0;
  function connect() {
    if (closed) return; onSt('wait'); let w;
    try { w = new WebSocket(def.u.replace(/^http/, 'ws') + '/' + topic + '/ws' + (lastId ? '?since=' + encodeURIComponent(lastId) : '')); } catch (e) { return later(); }
    ws = w;

      let ev; try { ev = JSON.parse(e.data); } catch (x) { return; }

      if (ev.id) lastId = ev.id;
      onData(ev.message);
    };
    w.onclose = () => { if (ws === w) { onSt('fail'); later(); } };
    w.onerror = () => { try { w.close(); } catch (x) {} };
  }
  function later() { if (!closed) setTimeout(connect, Math.min(8000, 700 * (++retry))); }

  return { send, close() { closed = true; try { ws && ws.close(); } catch (e) {} } };
}

function mqttConn(def, topic, onData, onSt) {

  app.innerHTML = `${head}<div class="panel"><h2>Join room <span dir="ltr">${esc(room)}</span></h2>
    <label class="muted" for="pname">Your name</label>
    <input type="text" id="pname" maxlength="14" autocomplete="off" value="${esc(me.name)}" placeholder="e.g. Dustin">
    <button class="btn block" id="doJoin" type="button">Join</button></div>`;
  $('doJoin').onclick = () => { const n = $('pname').value.trim(); if (!n) return $('pname').focus(); me.name = n; store.set('sd-name', n); playerGo(); };
  if (me.name && Q.get('auto') !== '0' && store.get('sd-joined-' + room)) playerGo();
}
function playerGo() {
  store.set('sd-joined-' + me.room, '1');
  app.innerHTML = `<div class="status" id="status">Connecting…</div>${head}
  <div id="pwait" class="panel"><h2>Looking for the host…</h2><p class="muted">If this takes more than a few seconds, check the room code and make sure the host's screen is open.</p><p class="muted" dir="ltr" id="pdiag"></p></div>
  <div id="pgame" hidden>
    <div class="panel glow" id="pclockbox"></div>
    <div class="panel" style="margin-top:12px" id="paction"></div>
    <div id="pextra"></div>
    <div style="margin-top:12px" id="pscene"></div>
    <div class="panel" style="margin-top:12px" id="pboardbox"></div>
    <div class="panel" style="margin-top:12px"><h3>Events</h3><div id="plog"></div></div>
    <div class="panel" style="margin-top:12px" id="pabs"></div>
    <div class="panel" style="margin-top:12px" id="prole"></div>
  </div>
  <div class="sheet" id="psheet" hidden></div>
  <div class="win" id="pend" hidden></div>`;
  let pOk = 0;
  net = Net(me.room, playerOnMsg, (s, d) => {
    const el = $('status'); if (el) { el.className = 'status' + (s === 'on' ? '' : ' off'); el.textContent = statText(s, d); }
    const dg = $('pdiag'); if (dg) dg.textContent = relayLine(d);
    const more = okCount(d) > pOk; pOk = okCount(d);
    if (more && net) { net.send({ f: me.pid, t: 'join', d: { n: me.name } }); }
  });
  net.send({ f: me.pid, t: 'join', d: { n: me.name } });
  setInterval(() => {
    if (!PS) net.send({ f: me.pid, t: 'join', d: { n: me.name } }, 1);
    else if ((PS.ph === 'role' || PS.ph === 'play') && !myRole) net.send({ f: me.pid, t: 'hello' }, 1);
  }, 3000);
  setInterval(() => net.send({ f: me.pid, t: 'ping' }, 1), 30000);
  setInterval(() => { const el = $('status'); if (el && lastHost && Date.now() - lastHost > 80000) { el.className = 'status off'; el.textContent = 'The host is not answering'; } }, 5000);
  app.addEventListener('click', playerClick);
}
function playerOnMsg(m) {
  if (m.f !== 'h') return;
  lastHost = Date.now();
  if (m.to && m.to !== me.pid) return;
  if (m.t === 'q') { qmsg = Object.assign({ at: Date.now(), pick: -1, picks: [] }, m.d, { rid: ++qSeq }); return paint(); }
  if (m.t === 'role') { myRole = m.d; return paint(); }
  if (m.t === 'st') { if (!PS || m.d.v >= PS.v) { PS = m.d; paint(); } }
}
const roleCardHtml = () => {
  const t = myRole.r === 't', R = SD.ROLES[t ? 'traitor' : 'team'];
  return `<div class="rolecard ${t ? 't' : ''}"><h2>${esc(R.title)}</h2><p>${esc(R.en)}</p><h2 class="fa" dir="rtl" lang="fa">${esc(R.titleFa)}</h2><p class="fa" dir="rtl" lang="fa">${esc(R.fa)}</p>
  ${t ? `<p class="warn">${myRole.mates.length ? 'Your partners: <b>' + myRole.mates.map(esc).join(', ') + '</b>' : 'You are the only traitor.'}</p>` : ''}</div>`;
};
function abilCard(k, mine, clickable) {
  const i = abInfo(k), u = mine.a[k], dead = !(u > 0);
  let off = dead || (clickable && (i.mode !== 'turn' || (k === 'elephant' && mine.hc < 2)));
  const note = dead ? 'Used' : i.mode === 'other' ? "Used on another player's turn" : i.mode === 'passive' ? 'Works by itself' : k === 'elephant' && mine.hc < 2 && clickable ? 'Needs 2 answered questions' : 'Ready';
  const inner = `<b>${esc(i.name)} <span class="pill ${dead ? 'bad' : 'good'}">${note}</span></b><span class="muted">${esc(i.en)}</span>${faLine(i.fa)}`;
  if (!clickable) return `<div class="abil card${dead ? ' dead' : ''}">${inner}</div>`;
  return `<button class="abil" ${!off ? `data-p="use:${esc(k)}"` : 'disabled'} type="button">${inner}</button>`;
}
function paint() {
  const st = PS; if (!st) return;
  const mine = st.pl.find(p => p.i === me.pid);
  if (!mine) { net.send({ f: me.pid, t: 'join', d: { n: me.name } }); return; }
  const lobbyish = st.ph === 'lobby' || st.ph === 'abil' || st.ph === 'role';
  $('pwait').hidden = !lobbyish; $('pgame').hidden = lobbyish;
  if (lobbyish) { $('pend').hidden = true; $('psheet').hidden = true; clearInterval(qTick); qmsg = null; }
  if (st.ph === 'lobby') {
    roleShown = false; bpSel = new Set();
    $('pwait').innerHTML = `<h2>Waiting for the game to start</h2><p class="muted">The host will deal the abilities when everyone has joined.</p>
      <div class="chips">${st.pl.map(p => `<span class="chk"><span class="dot${p.o ? ' on' : ''}"></span>${esc(p.n)}${p.i === me.pid ? ' (you)' : ''}</span>`).join('')}</div>`;
    return;
  }
  if (st.ph === 'abil') {
    myRole = null; roleShown = false;
    const keys = Object.keys(mine.a), hasBp = 'backpack' in mine.a, others = st.pl.filter(p => p.i !== me.pid), need = Math.min(2, others.length);
    if (mine.c) { $('pwait').innerHTML = `<h2>Confirmed ✓</h2><p class="muted">Waiting for the other players… (${st.pl.filter(p => p.c).length}/${st.pl.length})</p>`; return; }
    $('pwait').innerHTML = `<h2>Your abilities <span class="fa" dir="rtl" lang="fa">· توانایی‌های تو</span></h2>
      <p class="muted">Each ability can be used once per game. Read them, then confirm. ${faLine('هر توانایی فقط یک بار در کل بازی قابل استفاده است. بخوان و تأیید کن.')}</p>
      ${keys.map(k => abilCard(k, mine, false)).join('') || '<p class="muted">You have no abilities.</p>'}
      ${hasBp ? `<h3>Backpack: choose ${need} friend${need === 1 ? '' : 's'} <span class="fa" dir="rtl" lang="fa">· دوست‌هایت را انتخاب کن</span></h3><div class="chips">${others.map(p => `<button class="btn small ${bpSel.has(p.i) ? '' : 'ghost'}" data-p="bps:${p.i}" type="button">${bpSel.has(p.i) ? '✓ ' : ''}${esc(p.n)}</button>`).join('')}</div>` : ''}
      <button class="btn block" data-p="conf" type="button" ${hasBp && bpSel.size < need ? 'disabled' : ''}>Confirm / تایید</button>`;
    return;
  }
  if (st.ph === 'role') {
    if (!myRole) { $('pwait').innerHTML = '<h2>Receiving your role…</h2>'; return; }
    if (mine.c) { $('pwait').innerHTML = `<h2>Ready ✓</h2><p class="muted">Waiting for the other players… (${st.pl.filter(p => p.c).length}/${st.pl.length})</p>`; return; }
    $('pwait').innerHTML = roleShown ? roleCardHtml() + '<button class="btn block" data-p="rc" type="button">Got it / متوجه شدم</button>'
      : `<h2>Your role is ready</h2><p class="muted">Make sure nobody is looking at your screen. ${faLine('مطمئن شو کسی به صفحه‌ات نگاه نمی‌کند.')}</p><button class="btn block" data-p="reveal" type="button">Reveal my role / نمایش نقش</button>`;
    return;
  }
  /* ---- play / end ---- */
  setClock(st.rem, st.pz);
  $('pclockbox').innerHTML = `<div class="row"><b class="grow">Time left</b><div class="clock" id="gclock">--:--</div></div>${st.pz ? '<p class="warn" style="margin:0">⏸ Paused by the host</p>' : ''}`;
  $('pscene').innerHTML = sceneHtml(st);
  const bb = $('pboardbox'); if (!$('board')) { bb.innerHTML = boardBlock(st); Board.key = ''; }
  boardUpdate(st); $('plog').innerHTML = logHtml(st);
  const end = $('pend');
  if (st.ph === 'end' && st.end) {
    const traitor = myRole && myRole.r === 't', w = st.end.w;
    const won = w === 'team' ? !traitor : w === 'traitors' ? traitor : false;
    end.hidden = false;
    end.innerHTML = `<div><h2>${w === 'team' ? 'YOU ESCAPED!' : w === 'traitors' ? 'THE UPSIDE DOWN WINS' : 'GAME OVER'}</h2>
      <p>${w === 'team' ? 'The pawn reached the exit in time.' : w === 'traitors' ? 'The clock ran out before the pawn reached the exit.' : 'The host ended the game.'}</p>
      ${w !== 'abort' ? `<p class="${won ? 'good' : 'bad'}"><b>${won ? 'You win!' : 'You lose.'}</b></p>` : ''}
      <p class="muted">The traitors were: <b>${st.end.tr.length ? st.end.tr.map(esc).join(', ') : 'nobody'}</b></p></div>`;
  } else end.hidden = true;
  const a = st.act, myTurn = st.turn === me.pid, el = $('paction'), sheet = $('psheet');
  trapToast(st, a);
  let h = '';
  if (a && a.st === 'q' && a.pid === me.pid && qmsg && qmsg.aid === a.aid) {
    if (qmsg.shown !== qmsg.rid) { qmsg.shown = qmsg.rid; startQuestion(); }
    h = `<h2>Your dice</h2>${diceHtml(a.d)}<div class="total">Total: <b>${a.t}</b></div>`;
  } else {
    sheet.hidden = true; clearInterval(qTick);
    if (a && a.d) h += diceHtml(a.d) + `<div class="total">Total: <b>${a.t}</b></div>`;
    if (st.ph === 'end' && !(a && a.st === 'r')) h += '<h2>Game over</h2>';
    else if (st.pz && !(a && a.st === 'r')) h += '<p class="muted">The game is paused.</p>';
    else if (a && a.st === 'r') h += `<div class="result ${a.res.ok ? 'good' : 'bad'}">${esc(pname(st, a.pid))}: ${esc(a.res.txt)}</div>` + (a.res.tp ? `<div class="trapcard">${a.res.tp.i} <b>${esc(a.res.tp.n)}</b> — ${esc(a.res.tp.t)}</div>` : '');
    else if (a && a.st === 'j') {
      const jud = mine.a.judger > 0 && a.pid !== me.pid && jDone !== a.aid;
      h += jud ? `<h2>⚖ Judger</h2><p>${esc(pname(st, a.pid))} is about to answer a question. Will they answer <b>correctly</b>?</p>
        <div class="row"><button class="btn grow" data-p="jp:c" type="button">Correct</button><button class="btn grow" data-p="jp:w" type="button">Wrong</button><button class="btn ghost" data-p="jp:s" type="button">Skip</button></div>
        <p class="muted">Right: the pawn moves ${a.t * 2} cells forward. Wrong: ${a.t * 2} cells back. You can do this once.</p>${faLine('پیش‌بینی درست: مهره ' + a.t * 2 + ' خانه جلو. پیش‌بینی غلط: ' + a.t * 2 + ' خانه عقب. فقط یک بار.')}`
        : `<p class="muted">${esc(pname(st, a.pid))} rolled ${a.t}. The question is coming…</p>`;
    }
    else if (a && a.st === 'q') h += `<p class="muted">${esc(pname(st, a.pid))} is answering the question…</p>`;
    else if (a && a.st === 'c' && a.pid === me.pid) h += `<h2>${a.ab ? esc(abInfo(a.ab).name) : 'Plain move'}</h2><button class="btn block" data-p="roll" type="button">Roll the dice</button>`;
    else if (a && a.st === 'c') h += `<p class="muted">${esc(pname(st, a.pid))} chose ${a.ab ? '“' + esc(abInfo(a.ab).name) + '”' : 'a plain move'}…</p>`;
    else if (!a && myTurn && st.ph === 'play') {
      const avail = Object.keys(mine.a).filter(k => abInfo(k).mode === 'turn');
      h += `<h2>Your turn!</h2><p class="muted">Pick an ability, or make a plain move. Then roll the dice. Using an ability is a risk: a wrong answer sends the pawn back (except for Runner).</p>${avail.map(k => abilCard(k, mine, true)).join('')}<button class="abil" data-p="use:" type="button"><b>Plain move</b><span class="muted">No ability. A wrong answer does nothing.</span></button>`;
    }
    else if (!a && st.ph === 'play') h += `<p class="muted">It is ${esc(st.turn ? pname(st, st.turn) : 'nobody')}'s turn.</p>`;
  }
  el.innerHTML = h;
  /* extra panels */
  let ex = '';
  if (st.ph === 'play' && !st.pz) {
    if (mine.a.backpack > 0) ex += `<div class="panel" style="margin-top:12px"><h3>🎒 Backpack</h3><p class="muted">Points: <b>${mine.bp.pts}</b>. Cash in once: the pawn moves forward by that many cells.</p><button class="btn small" data-p="bp" type="button" ${mine.bp.pts > 0 ? '' : 'disabled'}>Cash in ${mine.bp.pts} point${mine.bp.pts === 1 ? '' : 's'}</button></div>`;
  }
  $('pextra').innerHTML = ex;
  $('pabs').innerHTML = `<h3>Your abilities <span class="fa" dir="rtl" lang="fa">· توانایی‌های تو</span></h3>${Object.keys(mine.a).map(k => abilCard(k, mine, false)).join('') || '<p class="muted">None.</p>'}`;
  $('prole').innerHTML = myRole ? `<details><summary>My role / نقش من</summary><div style="margin-top:10px">${roleCardHtml()}</div></details>` : '';
}
function startQuestion() {
  const sh = $('psheet'), q = qmsg; sh.hidden = false; clearInterval(qTick);
  sh.innerHTML = `<div class="row">${q.mem ? '<span class="pill warn">Memory</span>' : `<span class="pill ${q.L === 1 ? 'good' : q.L === 2 ? 'warn' : 'bad'}">${LVN[q.L]}</span>`}<span class="q-time grow" style="text-align:right" id="qt"></span></div>
  <div class="bar"><i id="qb"></i></div><p class="q-text" dir="auto">${esc(q.text)}</p>
  ${q.dr ? '<p class="muted" style="margin-top:-6px">Drama Queen: choose up to TWO options, then press Submit.</p>' : ''}
  ${q.opts.map((o, i) => `<button class="opt" data-p="ans:${i}" type="button" dir="auto">${esc(o)}</button>`).join('')}
  ${q.dr ? '<button class="btn block" data-p="sub" type="button" disabled id="subBtn">Submit</button>' : ''}
  ${q.sw ? '<button class="btn ghost block" data-p="swap" type="button" id="swapBtn" style="margin-top:8px">🔄 Swap this question (once)</button>' : ''}`;
  qTick = setInterval(() => {
    const left = Math.max(0, q.ms - (Date.now() - q.at)), qt = $('qt'), qb = $('qb'); if (!qt) return clearInterval(qTick);
    qt.textContent = Math.ceil(left / 1000); qb.style.transform = `scaleX(${left / q.ms})`;
    if (left <= 0) { clearInterval(qTick); sh.querySelectorAll('.opt,#subBtn,#swapBtn').forEach(b => { b.disabled = true; }); }
  }, 150);
}
function playerClick(e) {
  const b = e.target.closest('[data-p]'); if (!b || role !== 'player') return;
  const [k, v] = b.dataset.p.split(':');
  if (k === 'reveal') { roleShown = true; return paint(); }
  if (!PS) return;
  const st = PS, a = st.act, mine = st.pl.find(p => p.i === me.pid);
  if (k === 'bps') { if (bpSel.has(v)) bpSel.delete(v); else if (bpSel.size < 2) bpSel.add(v); return paint(); }
  if (k === 'conf' && st.ph === 'abil') { net.send({ f: me.pid, t: 'conf', d: { w: [...bpSel] } }); buzz(15); b.disabled = true; return; }
  if (k === 'rc' && st.ph === 'role') { net.send({ f: me.pid, t: 'conf' }); roleShown = false; buzz(15); b.disabled = true; return; }
  if (k === 'use' && !a && st.turn === me.pid) { buzz(15); net.send({ f: me.pid, t: 'use', d: { tid: st.tid, ab: v || null } }); }
  if (k === 'roll' && a && a.st === 'c' && a.pid === me.pid) { buzz(25); b.disabled = true; net.send({ f: me.pid, t: 'roll', d: { aid: a.aid } }); }
  if (k === 'jp' && a && a.st === 'j') { jDone = a.aid; if (v !== 's') net.send({ f: me.pid, t: 'jp', d: { aid: a.aid, g: v } }); paint(); }
  if (k === 'bp') { net.send({ f: me.pid, t: 'bp' }); b.disabled = true; }
  if (k === 'swap' && a && a.st === 'q' && qmsg && qmsg.aid === a.aid) { b.disabled = true; net.send({ f: me.pid, t: 'swap', d: { aid: a.aid } }); }
  if (k === 'ans' && a && a.st === 'q' && qmsg && qmsg.aid === a.aid && qmsg.pick < 0) {
    const i = +v;
    if (qmsg.dr) {
      const at = qmsg.picks.indexOf(i);
      if (at >= 0) qmsg.picks.splice(at, 1); else if (qmsg.picks.length < 2) qmsg.picks.push(i);
      $('psheet').querySelectorAll('.opt').forEach((x, n) => x.classList.toggle('pick', qmsg.picks.includes(n)));
      const sb = $('subBtn'); if (sb) sb.disabled = !qmsg.picks.length;
      return;
    }
    qmsg.pick = i; b.classList.add('pick'); $('psheet').querySelectorAll('.opt,#swapBtn').forEach(x => { x.disabled = true; });
    net.send({ f: me.pid, t: 'ans', d: { aid: a.aid, i } });
  }
  if (k === 'sub' && a && a.st === 'q' && qmsg && qmsg.aid === a.aid && qmsg.pick < 0 && qmsg.picks.length) {
    qmsg.pick = qmsg.picks[0]; $('psheet').querySelectorAll('.opt,#subBtn,#swapBtn').forEach(x => { x.disabled = true; });
    net.send({ f: me.pid, t: 'ans', d: { aid: a.aid, i: qmsg.picks[0], j: qmsg.picks.length > 1 ? qmsg.picks[1] : -1 } });
  }
}

startScreen();
</script>
